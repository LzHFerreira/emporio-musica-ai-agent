<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Entrar na área da equipe</title>
  </head>
  <body>
    <main>
      <h1>Entrar na área da equipe</h1>
      {% if form.errors %}
        <p role="alert">Por favor, informe um usuário e senha corretos</p>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <p>
          <label for="id_username">Usuário</label>
          <input id="id_username" name="username" type="text" autocomplete="username" required>
        </p>
        <p>
          <label for="id_password">Senha</label>
          <input id="id_password" name="password" type="password" autocomplete="current-password" required>
        </p>
        <button type="submit">Entrar</button>
      </form>
    </main>
  </body>
</html>
